# Configuración básica de eventos (obligatoria por sintaxis, aunque esté vacía)
events {
    worker_connections 1024;
}

# Bloque principal para la configuración de tráfico HTTP
http {
    # Incluye los tipos de archivos (MIME types) para que el navegador 
    # reconozca correctamente CSS, JS e imágenes.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        # Indica que Nginx escuchará las peticiones en el puerto 80
        listen 80;

        # Bloque de ubicación para todas las rutas del sitio ("/")
        location / {
            # Carpeta raíz donde se encuentra el build de tu aplicación React
            root /usr/share/nginx/html;

            # Define el archivo principal que se debe servir por defecto
            index index.html;

            # --- ESTA ES LA CLAVE PARA REACT ROUTER ---
            # Intenta servir la ruta como un archivo ($uri). 
            # Si el archivo o carpeta no existe, redirige todo a /index.html.
            # Ejemplo: Si el usuario entra a /dashboard, Nginx no encontrará ese archivo,
            # así que servirá index.html y dejará que React maneje la ruta internamente.
            try_files $uri $uri/ /index.html;
        }

        # Opcional: Configuración para manejar errores (500, 502, etc)
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}